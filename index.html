<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MuzEdits Komik Kamera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-watermark {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.05; transform: scale(1.03); }
        }
        .muzedits-watermark {
            animation: pulse-watermark 4s infinite ease-in-out;
        }
        /* Komik ve Yamultma Efektleri */
        .fx-normal { filter: none; transform: scale(1); }
        .fx-fisheye { filter: contrast(130%) saturate(140%); transform: perspective(300px) rotateX(10deg); }
        .fx-wave { filter: hue-rotate(90deg) contrast(150%); }
        .fx-whirl { filter: invert(15%) hue-rotate(180deg); }
        .fx-stretch { transform: scaleX(1.3) scaleY(0.9); }
        .fx-compress { transform: scaleX(0.8) scaleY(1.2); }
        .fx-pixel { filter: contrast(200%) brightness(1.1); }
        .fx-glitch { filter: drop-shadow(3px -3px #ff0055) drop-shadow(-3px 3px #00ffff); }
        .fx-neon { filter: drop-shadow(0 0 10px #38bdf8) brightness(1.3); }
        .fx-retro { filter: sepia(0.8) contrast(1.4) brightness(0.9); }
        .fx-matrix { filter: hue-rotate(100deg) saturate(300%) contrast(1.5); }
        .fx-horror { filter: brightness(0.6) contrast(1.8) grayscale(0.5); }
        .fx-cyber { filter: hue-rotate(240deg) invert(10%) contrast(1.4); }
        .fx-party { filter: hue-rotate(300deg) saturate(400%); }
        .fx-alien { filter: hue-rotate(150deg) invert(20%) brightness(1.2); }
        .fx-fuzzy { filter: blur(1px) contrast(150%); }
        .fx-mirror { transform: scaleX(-1); }
        .fx-mini { transform: scale(0.7); }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-between overflow-hidden select-none">

    <!-- Üst Başlık ve Kamera Değiştir -->
    <header class="flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent z-20">
        <span class="text-sky-400 font-black text-base tracking-wider">MUZEDITS <span class="text-[10px] text-white font-normal bg-sky-600 px-2 py-0.5 rounded-full">Komik Kamera</span></span>
        <button id="switchCam" class="bg-white/10 hover:bg-white/25 px-3 py-1.5 rounded-full text-xs font-semibold backdrop-blur border border-white/10">Kamerayı Çevir</button>
    </header>

    <!-- Kamera Önizleme Alanı (Tam Telefon Ekranı Uyumlu) -->
    <main class="relative flex-1 flex items-center justify-center overflow-hidden my-auto">
        <video id="cameraStream" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover fx-normal transition-all duration-300"></video>
        
        <!-- %20 Şeffaf Yanıp Sönen MuzEdits Filigranı -->
        <div class="absolute bottom-6 right-6 text-white font-black text-sm tracking-widest muzedits-watermark pointer-events-none drop-shadow-lg z-10">
            MuzEdits
        </div>
    </main>

    <!-- Alt Efekt Seçim Paneli (15-20 Komik Efekt Kaydırmalı Kutu) -->
    <footer class="bg-slate-950/90 border-t border-slate-800/80 p-3 z-20 backdrop-blur-md">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
            <span>Komik & Yamultma Efektleri (18 Adet)</span>
            <span class="text-sky-400">Seç ve Eğlen</span>
        </div>
        <!-- Yatay Kaydırılabilir Efekt Butonları -->
        <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none" id="effectList">
            <button onclick="setEffect('normal', this)" class="shrink-0 px-3 py-2 bg-sky-600 text-white text-xs font-bold rounded-xl border border-sky-500">Normal</button>
            <button onclick="setEffect('fisheye', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Balık Gözü</button>
            <button onclick="setEffect('wave', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Çılgın Dalga</button>
            <button onclick="setEffect('whirl', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Girdap</button>
            <button onclick="setEffect('stretch', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Kafa Esnet</button>
            <button onclick="setEffect('compress', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Sıkıştır</button>
            <button onclick="setEffect('pixel', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Piksel Patlaması</button>
            <button onclick="setEffect('glitch', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Cyber Glitch</button>
            <button onclick="setEffect('neon', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Neon Parlama</button>
            <button onclick="setEffect('retro', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Retro VHS</button>
            <button onclick="setEffect('matrix', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Matrix Yeşil</button>
            <button onclick="setEffect('horror', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Karanlık Mod</button>
            <button onclick="setEffect('cyber', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Cyberpunk</button>
            <button onclick="setEffect('party', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Parti Modu</button>
            <button onclick="setEffect('alien', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Uzaylı Surat</button>
            <button onclick="setEffect('fuzzy', this)`" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Buğulu Cam</button>
            <button onclick="setEffect('mirror', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Ayna Efekti</button>
            <button onclick="setEffect('mini', this)" class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800">Mini Kafa</button>
        </div>
    </footer>

    <!-- Kamera ve Efekt Kontrol Kodları -->
    <script>
        const video = document.getElementById('cameraStream');
        let currentFacingMode = 'user'; // Ön kamera başlangıç

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 720 }, height: { ideal: 1280 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Kamera izni alınamadı veya kamera bulunamadı: " + err);
            }
        }

        document.getElementById('switchCam').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        function setEffect(effectName, btn) {
            // Sınıfları sıfırla
            video.className = `absolute inset-0 w-full h-full object-cover fx-${effectName} transition-all duration-300`;
            
            // Buton aktiflik renkleri
            document.querySelectorAll('#effectList button').forEach(b => {
                b.className = "shrink-0 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded-xl border border-slate-800";
            });
            btn.className = "shrink-0 px-3 py-2 bg-sky-600 text-white text-xs font-bold rounded-xl border border-sky-500 shadow-lg shadow-sky-900/50";
        }

        // Sayfa açıldığında kamerayı başlat
        startCamera();
    </script>
</body>
</html>
